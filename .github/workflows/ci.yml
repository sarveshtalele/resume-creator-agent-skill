name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run the end-to-end suite
        run: npm test

  measurements:
    name: documentation measurements are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Regenerate measurements and diagrams
        run: |
          npm run measure -- --json
          npm run diagrams

      - name: Fail if the committed docs drifted from the source
        run: git diff --exit-code -- docs/
